name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. CI: build & kiểm tra ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Check backend
        working-directory: server
        run: |
          npm ci
          node --check index.js

  # ---------- 2. CD: build image, push Harbor, deploy trên AWS ----------
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Login Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build Docker image
        env:
          HARBOR_IMAGE: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/ielts-flashcards
        run: |
          docker build             -t "${HARBOR_IMAGE}:${GITHUB_SHA}"             -t "${HARBOR_IMAGE}:latest"             .

      - name: Push image to Harbor
        env:
          HARBOR_IMAGE: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/ielts-flashcards
        run: |
          docker push "${HARBOR_IMAGE}:${GITHUB_SHA}"
          docker push "${HARBOR_IMAGE}:latest"

      - name: Deploy from Harbor
        run: |
          cd ~/ielts-flashcards
          docker compose pull
          docker compose up -d
          docker image prune -f

          echo "Waiting for application health..."
          for i in {1..20}; do
            if curl --fail --silent --show-error http://localhost:8080/api/health; then
              echo
              echo "Application is healthy"
              exit 0
            fi

            echo "Health check attempt $i/20 failed, retrying in 3s..."
            sleep 3
          done

          echo "Application did not become healthy in time"
          docker compose ps
          docker compose logs --tail=100
          exit 1
