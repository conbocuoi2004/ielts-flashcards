name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- 1. Build & kiểm tra ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài & build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Kiểm tra backend
        working-directory: server
        run: |
          npm ci
          node --check index.js

  # ---------- 2. Build & push image lên GHCR ----------
  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 3. Đồng bộ image sang Harbor + deploy trên AWS ----------
  harbor-deploy:
    needs: docker
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Đăng nhập Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Pull từ GHCR và push sang Harbor
        env:
          HARBOR_IMAGE: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/ielts-flashcards
        run: |
          docker pull "${IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "${HARBOR_IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "${HARBOR_IMAGE}:latest"
          docker push "${HARBOR_IMAGE}:${GITHUB_SHA}"
          docker push "${HARBOR_IMAGE}:latest"

      - name: Deploy trên AWS EC2
        run: |
          cd ~/ielts-flashcards
          docker compose pull
          docker compose up -d
          docker image prune -f
          curl --fail --retry 10 --retry-delay 3 http://localhost:8080/api/health
